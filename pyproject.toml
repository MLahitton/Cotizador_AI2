[project]
name = "cotizador-ai2"
version = "0.1.0"
description = "Servicio de inteligencia artificial para extracción multimodal de requerimientos de Steel and Glass."
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "google-genai",
    "python-multipart",
    "openpyxl",
    "pillow",
    "httpx",
    "pypdfium2>=5.8,<6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = [
    "tests/test_effiliving_regression_trace_runner.py",
    "tests/test_gemini_discovery_provider.py",
    "tests/test_gemini_enrichment_pipeline.py",
    "tests/test_gemini_extraction_mapper.py",
    "tests/test_gemini_extraction_provider_files.py",
    "tests/test_gemini_provider.py",
    "tests/test_corpus_new_pipeline_runner.py",
    "tests/test_corpus_v1_runner.py",
    "tests/test_source_preparation_v1.py",
    "tests/test_document_localization_v1.py",
    "tests/test_localization_api_diagnostics.py",
    "tests/test_localization_api_schema.py",
    "tests/test_localization_image_frames.py",
    "tests/test_localized_technical_reader.py",
    "tests/test_localized_extraction_pipeline_integration.py",
    "tests/test_historical_quote_models.py",
    "tests/test_historical_workbook.py",
    "tests/test_quantity_grounding.py",
    "tests/test_region_sanitizer.py",
    "tests/test_requirements_api.py",
    "tests/test_requirement_extraction.py",
    "tests/test_semantic_review.py",
]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
